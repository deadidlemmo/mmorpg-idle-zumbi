name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://zumbi:zumbi@localhost:5432/mmorpg_zumbi?schema=public
      JWT_SECRET: ci-only-secret
      WORLD_BOSS_TEST_UNLOCK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: frontend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run images:audit:equipment
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zumbi
          POSTGRES_PASSWORD: zumbi
          POSTGRES_DB: mmorpg_zumbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zumbi -d mmorpg_zumbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://zumbi:zumbi@localhost:5432/mmorpg_zumbi?schema=public
      JWT_SECRET: ci-only-e2e-secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      WORLD_BOSS_TEST_UNLOCK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run prisma:seed
        working-directory: backend
      - run: npm run prisma:audit:crafting-chain
        working-directory: backend
      - run: npm run prisma:audit:economy-time
        working-directory: backend
      - run: npm run items:stats:audit
        working-directory: backend
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run backup:database -- --output=tmp/ci-backup.dump
        working-directory: backend
      - run: npm run backup:verify -- --backup=tmp/ci-backup.dump
        working-directory: backend
      - run: npm run test:e2e -- --runInBand
        working-directory: backend
